<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>ROCK PAPER SCISSORS</h1>
        </div>

        <div class="game-container">
            <div class="players-container">
                <div class="player">
                    <div class = "sprite">
                        <div class="icon-photo"></div>
                        <p>Player</p>
                    </div>
                </div>
                <div class="versus">VS</div>
                <div class="computer">
                    <div class = "sprite">
                        <div class="icon-photo"></div>
                        <p>CPU</p>
                    </div>
                </div>
            </div>
            <div class="game-panel">
                <div class="player-panel">
                    <img src="rock.png" alt="" width="250" height="250">
                    <div class="score-container playerscore">
                        <p id="playerScore">0</p>
                    </div>
                </div>
                <div class="cpu-panel">
                    <img src="scissors.png" alt="" width="250" height="250">
                    <div class="score-container cpuscore">
                        <p id="playerScore">0</p>
                    </div>
                </div>
            </div>
            <div class="buttons">
                <button id="rock">Rock</button>
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
            </div>
        </div>

        <div class="footer">
            <p>Copyright &copy; 2026 alexisjhay</p>
        </div>

    </div>
</body>
</html>
